        select.rightUpperLimb {

            z-index: 10; /* canvasより前面に表示 */
        }
        select.leftUpperLimb {
            text-align: center;

            top: 360px;   /* 任意の位置に調整 */

            z-index: 10; /* canvasより前面に表示 */
        }
        select.rightLowerLimb {
            text-align: center;
            position: absolute; /* コンテナ内で絶対配置 */
            top: 480px;   /* 任意の位置に調整 */

        }
        select.leftLowerLimb {
            text-align: center;
            position: absolute; /* コンテナ内で絶対配置 */
            top: 480px;   /* 任意の位置に調整 */
            left: 354px;  /* 任意の位置に調整 */
            z-index: 10; /* canvasより前面に表示 */
        }
        select.bodyTrunk {
            text-align: center;
            position: absolute; /* コンテナ内で絶対配置 */

            z-index: 10; /* canvasより前面に表示 */
        }
        select.IndicateAcMx {
            position: absolute; /* コンテナ内で絶対配置 */
            top: 520px;   /* 任意の位置に調整 */

            z-index: 10; /* canvasより前面に表示 */
        }
        select.AcMxTec {
            position: absolute; /* コンテナ内で絶対配置 */

        fieldset#IndicateAcMx {

<body>
<canvas id="BodyAnatomy" width="600" height="800" class="BodyAnatomy"></canvas>
<select name="rightUpperLimb" id="limb[0]" class="rightUpperLimb">
<option value="0">なし</option>
<option value="1">マッサージ</option>
<option value="3">変形徒手矯正</option>
</select>
<select name="leftUpperLimb" id="limb[1]" class="leftUpperLimb">
<option value="0">なし</option>
<option value="1">マッサージ</option>
<option value="3">変形徒手矯正</option>
</select>
<select name="rightLowerLimb" id="limb[2]" class="rightLowerLimb">
<option value="0">なし</option>
<option value="1">マッサージ</option>
<option value="3">変形徒手矯正</option>
</select>
<select name="leftLowerLimb" id="limb[3]" class="leftLowerLimb">
<option value="0">なし</option>
<option value="1">マッサージ</option>
<option value="3">変形徒手矯正</option>
</select>
<select name="bodyTrunk" id="limb[4]" class="bodyTrunk">
<option value="0">なし</option>
<option value="1">マッサージ</option>
</select>
<fieldset name="IndicateAcMx" id="IndicateAcMx">
<legend>鍼灸適応症（複数可）</legend>
<label><input type="checkbox" name="IndicateAcMx" />神経痛</label><br />
<label><input type="checkbox" name="IndicateAcMx" />リウマチ</label><br />
<label><input type="checkbox" name="IndicateAcMx" />五十肩</label><br />
<label><input type="checkbox" name="IndicateAcMx" />頸腕症候群</label><br />
<label><input type="checkbox" name="IndicateAcMx" />腰痛症</label><br />
<label><input type="checkbox" name="IndicateAcMx" />頸椎捻挫後遺症</label><br />
<label title="医師の同意書に記載された慢性疼痛等"><input type="checkbox" name="IndicateAcMx" />その他<sub>慢性疼痛</sub></label><br />
<select name="AcMxTec" id="AcMxTec">
<option value="">選択してください</option>
<option value="1">鍼きゅう１術</option>
<option value="2">鍼きゅう２術</option>
</select>
</fieldset>
<div class="BurdenRatio">
保険負担割合:<select name="BurdenRatio" id="BurdenRatio">
<option value="1">１割</option>
<option value="2">２割</option>
<option value="3">３割</option>
<option value="10">全額(10割)</option>
</select>
負担で<input type="button" value="計算！" id="HomeVisitedOfMassage" onclick="runCalculator();">
<br />
同一住所のご利用者人数:<select name="HeadCount" id="HeadCount">
<option value="1">ご自宅</option>
<option value="1">１人</option>
<option value="2">２人</option>
<option value="3">３～９人</option>
<option value="10">１０～１９人</option>
<option value="20">２０人以上</option>
<option value="0">往診料含まない</option>
</select>
<ul>
<li>あんまマッサージ指圧
<ul>
<li>痛みやしびれで「マッサージ」希望部位を選ぶ
<li>拘縮や筋麻痺もある場合は「変形徒手矯正」を選ぶ
<li>肩・股関節を挟む各肢は体躯のを「マッサージ」も追加を推奨
</ul>
<li>はり＆きゅう
<ul>
<li>鍼灸の適応症を選択する（複数可）
<li>「その他」は医師の同意書に記載された慢性疼痛等
<li>１術は鍼灸何れか、２術は両方（希望がかなわない場合もあり）
</ul>
<li>医療保険の保険負担割合を選ぶ
<li>[計算]ボタンを押す
</ul>
</div>
<div id="AnswersBodyAnatomy">施術料<br />
</div>
<div id="tableArea"></div>
</body>
